#Project Information
#March2023
site_name: HCLSoftware DevOps Plugins
site_description: >-
  A next-gen documentation site for HCLSoftware plugins.
site_url: https://opensource.hcltechsw.com/product-name
use_directory_urls: true

# Theme Configuration
theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  language: en
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
  custom_dir: theme_overrides/
  static_templates:
    - partials/comments.html
  
  icon:
    repo: fontawesome/brands/github
  font:
    text: Roboto
    code: Roboto Mono


  # Static files
  static_templates:
    - 404.html
    
    
# Markdown Extensions
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list

extra:
  analytics: 
    provider: custom
    property: G-7LF0XY95M1
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/HCL-TECH-SOFTWARE
  version:
    provider: mike
  alternate:
    - name: English
      link: /en/ 
      lang: en
  prodname: HCL Software 
  
  
# Repository. Change the location as per your product
repo_url: https://github.com/UrbanCode/IBM-UCx-PLUGIN-DOCS
repo_name: IBM-UCx-PLUGIN-DOCS
edit_uri: edit/main/docs

# Copyright. Change the year as per your product.
copyright: >-
  Copyright &copy; 2022, HCL Technologies Limited.

# Customization
extra_css:
  - stylesheets/style.css
extra_javascript:
    - javascripts/MkDocs_scCustLangSelect.js
    - javascripts/extra.js

#  - macros
 # - section-index 
 
 #Install the mkdocs-section-index plugin from https://github.com/oprypin/mkdocs-section-index. This plugin ensures that the parent topic can be linked to a topic so there is consistency when users click on the nav. After the installation, remove the hash symbol from section-index above this para. In the nav below, About and Overview topics are parents and are linked to topics.
  
